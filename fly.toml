app = "justdumpit-ytscraper"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  YTSCRAPER_SYNC_INTERVAL = "21600"
  YTSCRAPER_SYNC_STARTUP_DELAY = "120"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "ytscraper_data"
  destination = "/data"

[[services.tcp_checks]]
  grace_period = "10s"
  interval = "30s"
  timeout = "5s"

[deploy]
  release_command = "python -m src.cli db"